<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholar Daily Lite</title><style>
:root{color-scheme:light dark;font:16px system-ui;--accent:#159b94}body{max-width:1100px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}small,#status{opacity:.75}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.metric,section{border:1px solid #8885;border-radius:12px;padding:18px}.metric{flex:1;min-width:120px}.metric b{display:block;font-size:30px}section{margin:20px 0}button,select,input{font:inherit;padding:8px;margin:4px;border:1px solid #8887;border-radius:6px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #8884}td:last-child{text-align:right}td button{border:0;background:none;text-align:left;color:inherit;text-decoration:underline}svg{width:100%;height:auto;overflow:visible}#tip{min-height:25px}a{color:var(--accent)}
</style><h1>Scholar Daily Lite</h1><div id="status">Loading…</div><div class="metrics" id="metrics"></div><section><h2 id="heading">Total citation history</h2><select id="range"><option value="0">All time</option><option value="365">Last year</option><option value="90">Last 90 days</option><option value="30">Last 30 days</option></select><button id="overall">Overall profile</button><button id="export">Export selected CSV</button><svg id="chart" viewBox="0 0 900 300" role="img" aria-label="Citation history"></svg><div id="tip"></div><small>Observed cumulative counts only. Missing dates are not invented. Select a point to inspect its count.</small></section><section><h2>Publications</h2><input id="search" placeholder="Search publication titles"><table><thead><tr><th>Publication</th><th>Year</th><th>Latest observed citations</th></tr></thead><tbody id="papers"></tbody></table></section><script>
'use strict';const $=id=>document.getElementById(id);let data,selected=null, catalogue={};const ns='http://www.w3.org/2000/svg';function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}function text(parent,s){parent.textContent=s}function series(){let a=data.snapshots.map(s=>({date:s.date,count:selected?s.papers[selected]?.count:s.total}));const n=Number($('range').value);if(n&&a.length){const cutoff=Date.parse(a.at(-1).date)-(n-1)*86400000;a=a.filter(x=>Date.parse(x.date)>=cutoff)}return a}function draw(){const a=series(),v=a.filter(x=>x.count!==undefined),svg=$('chart');svg.replaceChildren();text($('heading'),selected?catalogue[selected].title:'Total citation history');text($('tip'),v.length?`${v.length} observations · ${v[0].date} to ${v.at(-1).date}`:'No observations yet');if(!v.length)return;const lo=Math.min(...v.map(x=>x.count)),hi=Math.max(...v.map(x=>x.count)),bottom=Math.max(0,lo===hi?lo-1:lo),top=Math.max(bottom+1,hi),start=Date.parse(a[0].date),end=Date.parse(a.at(-1).date);const x=d=>65+(end===start?390:(Date.parse(d)-start)/(end-start)*790),y=c=>255-(c-bottom)/(top-bottom)*220;for(let i=0;i<=4;i++){const c=bottom+(top-bottom)*i/4;el('line',{x1:65,x2:855,y1:y(c),y2:y(c),stroke:'currentColor',opacity:.12},svg);text(el('text',{x:57,y:y(c)+4,'text-anchor':'end',fill:'currentColor','font-size':12},svg),Number(c.toFixed(2)))}let prev=null;for(const p of a){if(p.count===undefined){prev=null;continue}if(prev&&Date.parse(p.date)-Date.parse(prev.date)===86400000)el('line',{x1:x(prev.date),y1:y(prev.count),x2:x(p.date),y2:y(p.count),stroke:'#159b94','stroke-width':2},svg);const dot=el('circle',{cx:x(p.date),cy:y(p.count),r:3,fill:'#159b94',tabindex:0},svg);const show=()=>text($('tip'),`${p.date}: ${p.count.toLocaleString()} citations`);dot.addEventListener('pointerenter',show);dot.addEventListener('focus',show);dot.addEventListener('click',show);text(el('title',{},dot),`${p.date}: ${p.count}`);prev=p}text(el('text',{x:65,y:282,fill:'currentColor','font-size':12},svg),a[0].date);text(el('text',{x:855,y:282,'text-anchor':'end',fill:'currentColor','font-size':12},svg),a.at(-1).date)}function table(){const body=$('papers');body.replaceChildren();const q=$('search').value.toLowerCase();for(const [id,p] of Object.entries(catalogue).sort((a,b)=>b[1].count-a[1].count)){if(!p.title.toLowerCase().includes(q))continue;const tr=body.insertRow(),b=document.createElement('button');text(b,p.title);b.onclick=()=>{selected=id;draw();$('heading').scrollIntoView({behavior:'smooth'})};tr.insertCell().append(b);text(tr.insertCell(),p.year);text(tr.insertCell(),`${p.count} (${p.date})`)}}$('overall').onclick=()=>{selected=null;draw()};$('range').onchange=draw;$('search').oninput=table;$('export').onclick=()=>{const blob=new Blob(['date,citations\n'+series().map(x=>`${x.date},${x.count??''}`).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='citation-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};async function init(){try{const r=await fetch('history.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();data.snapshots.sort((a,b)=>a.date.localeCompare(b.date));const last=data.snapshots.at(-1);if(last){text($('status'),`${last.name} · Last successful update: ${last.date} · ${Object.keys(last.papers).length} papers observed · ${last.complete?'No further page indicated':'Coverage incomplete or unknown'}`);for(const [label,n] of [['Citations',last.total],['h-index',last.h_index],['i10-index',last.i10_index],['Days recorded',data.snapshots.length]]){const d=document.createElement('div');d.className='metric';text(d,label);const b=document.createElement('b');text(b,n.toLocaleString());d.append(b);$('metrics').append(d)}for(const s of data.snapshots)for(const [id,p] of Object.entries(s.papers))catalogue[id]={...p,date:s.date}}else text($('status'),'No successful collection yet. Capture your profile using Scholar Daily Lite.');draw();table()}catch(e){text($('status'),'Could not load history: '+e.message+' — serve this folder using HTTP, not file://')}}init();</script></html>
